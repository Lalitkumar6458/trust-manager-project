# Firebase App Hosting (https://firebase.google.com/docs/app-hosting)
#   firebase apphosting:backends:create   → connect this repo, then every push deploys.
# NEXT_PUBLIC_* values are baked into the browser bundle at BUILD time, so they need BUILD availability.
# Secrets (the admin private key) are stored in Cloud Secret Manager:
#   firebase apphosting:secrets:set FIREBASE_ADMIN_PRIVATE_KEY
runConfig:
  minInstances: 0
  maxInstances: 4
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: REPLACE_ME
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: your-project.firebaseapp.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: your-project
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: your-project.firebasestorage.app
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: REPLACE_ME
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: REPLACE_ME
    availability: [BUILD, RUNTIME]
  # server only – used by /api/admin/users (staff logins)
  - variable: FIREBASE_ADMIN_PROJECT_ID
    value: your-project
    availability: [RUNTIME]
  - variable: FIREBASE_ADMIN_CLIENT_EMAIL
    value: firebase-adminsdk-xxxxx@your-project.iam.gserviceaccount.com
    availability: [RUNTIME]
  - variable: FIREBASE_ADMIN_PRIVATE_KEY
    secret: FIREBASE_ADMIN_PRIVATE_KEY
    availability: [RUNTIME]
