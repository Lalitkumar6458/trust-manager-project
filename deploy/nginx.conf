# Nginx site for Trust Manager (deploy/setup-vps.sh replaces __DOMAIN__; certbot adds the SSL part)
limit_req_zone $binary_remote_addr zone=tm_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    client_max_body_size 20m;        # document uploads (app limit is 15 MB)
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Next.js build files never change – cache them for a year
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # slow down password guessing (the app also locks a login after 5 wrong passwords)
    location = /api/auth/login {
        limit_req zone=tm_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # scheduled jobs are called only from the server itself (cron → 127.0.0.1:3000)
    location /api/cron/ { return 404; }

    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}
